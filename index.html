<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24705 — Painel de Acompanhamento</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>

:root{
  --navy:#1F3A5F;
  --navy-2:#EAF0F7;
  --paper:#F3F6FB;
  --card:#FFFFFF;
  --line:#E6ECF4;
  --line-strong:#D2DCEA;
  --ink:#243B53;
  --ink-soft:#8598AE;
  --accent:#4A90D9;
  --accent-soft:#EAF2FB;
  --st-exec:#4A90D9;
  --st-exec-bg:#EAF2FB;
  --st-concl:#E8A838;
  --st-concl-bg:#FCF3E1;
  --st-paral:#E0993A;
  --st-paral-bg:#FCF1E0;
  --st-cancel:#C0504D;
  --st-cancel-bg:#FBEBEA;
  --st-prep:#8FB8DE;
  --st-prep-bg:#EDF3FA;
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 2px 12px rgba(31,58,95,.06);
  --shadow-hover:0 4px 20px rgba(31,58,95,.10);
  --font-display:Arial,Helvetica,sans-serif;
  --font-body:Arial,Helvetica,sans-serif;
  --font-mono:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
.app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}

/* ---- title block ---- */
.titleblock{
  background:var(--card);
  color:var(--ink);
  padding:20px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:none;
  border-radius:0 0 var(--radius) var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:24px;
}
.tb-left{display:flex; align-items:center; gap:14px;}
.tb-code{font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); border:none; padding:6px 12px; border-radius:10px; font-weight:700;}
.tb-title{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.01em; color:var(--navy);}
.tb-right{font-family:var(--font-body); font-size:12px; color:var(--ink-soft); text-align:right; line-height:1.6; display:flex; align-items:center; gap:12px;}
.tb-live{display:inline-flex; align-items:center; gap:6px; background:#E6F7EE; color:#1E9E5A; font-weight:700; font-size:12px; padding:6px 13px; border-radius:20px;}
.tb-live::before{content:''; width:8px; height:8px; border-radius:50%; background:#1E9E5A; display:inline-block; animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.breadcrumb{
  background:transparent; color:var(--ink-soft); font-family:var(--font-body); font-size:13px;
  padding:0 6px 4px; display:flex; gap:8px; align-items:center; margin-bottom:20px;
}
.breadcrumb span.sep{opacity:.5;}
.breadcrumb button{
  background:none;border:none;color:var(--accent);font-family:var(--font-body);font-size:13px;cursor:pointer;padding:0;
  text-decoration:none; font-weight:600;
}
.breadcrumb button:hover{text-decoration:underline;}
.breadcrumb .current{color:var(--ink); font-weight:600;}

/* ---- generic ---- */
.grid{display:grid; gap:16px;}
.panel{
  background:var(--card);
  border:none;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel-head{
  font-family:var(--font-body); font-size:13px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink-soft); padding:16px 22px; border-bottom:1px solid var(--line); font-weight:700;
  display:flex; justify-content:space-between; align-items:center;
}
.panel-body{padding:22px;}

/* ---- overview stat strip ---- */
.stats{grid-template-columns:repeat(5,1fr); margin-bottom:16px; gap:16px;}
.stat{background:var(--card); border:none; border-radius:var(--radius); padding:22px; position:relative; box-shadow:var(--shadow); overflow:hidden;}
.stat::before{content:''; position:absolute; top:0; left:0; width:100%; height:5px; background:var(--accent);}
.stat-num{font-family:var(--font-display); font-size:32px; font-weight:700; color:var(--navy);}
.stat-label{font-size:12px; color:var(--ink-soft); margin-top:4px; letter-spacing:.02em;}

/* ---- overview lower grid ---- */
.overview-grid{grid-template-columns:1.3fr 1fr; margin-bottom:2px;}

.schema-map{position:relative; width:100%; height:340px; background:
  repeating-linear-gradient(0deg, transparent, transparent 33px, #E4E9E6 34px),
  repeating-linear-gradient(90deg, transparent, transparent 33px, #E4E9E6 34px);
  border:1px solid var(--line);
}
.schema-map .axis-label{position:absolute; font-family:var(--font-mono); font-size:9px; color:#9AA8A2;}
.pin{
  position:absolute; width:14px; height:14px; transform:translate(-50%,-50%);
  cursor:pointer;
}
.pin::before, .pin::after{content:''; position:absolute; background:currentColor;}
.pin::before{ width:14px; height:1.5px; top:6.25px; left:0;}
.pin::after{ width:1.5px; height:14px; left:6.25px; top:0;}
.pin .dot{position:absolute; width:7px; height:7px; border-radius:50%; background:currentColor; top:3.5px; left:3.5px; box-shadow:0 0 0 3px var(--paper2, #fff);}
.pin.exec{color:var(--st-exec);}
.pin.concl{color:var(--st-concl);}
.pin.paral{color:var(--st-paral);}
.pin.cancel{color:var(--st-cancel);}
.pin.prep{color:var(--st-prep);}
.pin:hover .dot{outline:2px solid var(--navy);}
.pin-tag{
  position:absolute; top:16px; left:50%; transform:translateX(-50%);
  font-family:var(--font-mono); font-size:9px; white-space:nowrap; color:var(--ink-soft);
  background:rgba(255,255,255,.85); padding:0 3px;
}

.legend{display:flex; gap:14px; flex-wrap:wrap; padding:10px 16px; border-top:1px solid var(--line); font-size:11px; color:var(--ink-soft);}
.legend .lg{display:flex; align-items:center; gap:5px;}
.legend .sw{width:9px;height:9px;border-radius:50%;}

.donut-wrap{display:flex; align-items:center; gap:20px; padding:6px 0;}
.status-rows{width:100%;}
.status-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line);}
.status-row:last-child{border-bottom:none;}
.status-row .sname{display:flex; align-items:center; gap:8px; font-size:13px;}
.status-row .sname .sw{width:9px;height:9px;border-radius:50%;}
.status-row .sval{font-family:var(--font-mono); font-weight:600; color:var(--navy);}

.insight{
  margin:2px 0 0; background:var(--st-paral-bg); border:1px solid var(--st-paral); border-left-width:5px;
  padding:14px 16px; font-size:13px; color:#5b4520; display:flex; gap:10px; align-items:flex-start;
}
.insight b{color:#4a3315;}

/* municipio list */
.muni-grid{grid-template-columns:repeat(3,1fr);}
.muni-card{
  background:var(--card); border:none; border-radius:var(--radius-sm); padding:16px 18px; cursor:pointer; transition:.15s; box-shadow:var(--shadow);
}
.muni-card:hover{background:var(--accent-soft); box-shadow:var(--shadow-hover);}
.muni-name{font-family:var(--font-display); font-weight:700; font-size:15px;}
.muni-meta{font-family:var(--font-body); font-size:12px; color:var(--ink-soft); margin-top:4px;}

/* obra cards */
.obra-list{grid-template-columns:1fr;}
.obra-row{
  display:grid; grid-template-columns:1fr auto auto auto; gap:18px; align-items:center;
  background:var(--card); border:none; border-radius:var(--radius-sm); padding:16px 18px; cursor:pointer; box-shadow:var(--shadow);
}
.obra-row:hover{background:var(--accent-soft); box-shadow:var(--shadow-hover);}
.obra-name{font-family:var(--font-display); font-weight:700; font-size:14px;}
.obra-sub{font-family:var(--font-body); font-size:12px; color:var(--ink-soft); margin-top:2px;}
.badge{
  font-family:var(--font-body); font-size:11px; letter-spacing:.02em; text-transform:uppercase; font-weight:700;
  padding:5px 11px; border-radius:20px; white-space:nowrap;
}
.badge.exec{background:var(--st-exec-bg); color:var(--st-exec);}
.badge.concl{background:var(--st-concl-bg); color:var(--st-concl);}
.badge.paral{background:var(--st-paral-bg); color:var(--st-paral);}
.badge.cancel{background:var(--st-cancel-bg); color:var(--st-cancel);}
.badge.prep{background:var(--st-prep-bg); color:var(--st-prep);}
.obra-val{font-family:var(--font-mono); font-size:12px; text-align:right;}
.obra-perc{font-family:var(--font-mono); font-size:12px; text-align:right; color:var(--ink-soft); min-width:52px;}

/* obra detail */
.obra-head{
  background:var(--card); border:1px solid var(--line); padding:20px 22px; margin-bottom:2px;
  display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.obra-head h2{font-family:var(--font-display); margin:0 0 6px; font-size:22px;}
.obra-head .meta-row{display:flex; gap:22px; flex-wrap:wrap; margin-top:10px;}
.meta-item{font-size:12px;}
.meta-item .k{color:var(--ink-soft); display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px;}
.meta-item .v{font-family:var(--font-mono); font-weight:600;}
.coord-callout{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); border:1px dashed var(--line-strong); padding:8px 10px; align-self:flex-start;}

.detail-grid{grid-template-columns:2fr 1fr;}

/* timeline */
.timeline{padding:20px 20px 6px; position:relative;}
.timeline::before{content:''; position:absolute; left:29px; top:8px; bottom:8px; width:2px; background:var(--line-strong);}
.tl-item{position:relative; padding-left:44px; padding-bottom:26px;}
.tl-item:last-child{padding-bottom:4px;}
.tl-dot{
  position:absolute; left:22px; top:2px; width:14px; height:14px; border-radius:50%;
  background:var(--card); border:2px solid var(--accent);
}
.tl-item.milestone .tl-dot{background:var(--navy); border-color:var(--navy);}
.tl-item.visita .tl-dot{background:var(--accent); border-color:var(--accent);}
.tl-item.snapshot .tl-dot{background:var(--card); border-color:var(--line-strong); width:10px; height:10px; left:24px; top:5px;}
.tl-item.snapshot{padding-bottom:16px;}
.tl-item.snapshot .tl-card{padding:8px 12px; font-family:var(--font-mono); font-size:11.5px; display:flex; justify-content:space-between; gap:10px; align-items:center; cursor:default;}
.tl-item.snapshot .tl-card .fase-tag{font-family:var(--font-body); font-size:10.5px; padding:1px 7px; background:var(--st-exec-bg); color:var(--st-exec); white-space:nowrap;}
.tl-item.snapshot .tl-comment{font-family:var(--font-body); font-size:12px; color:var(--ink-soft); margin-top:6px; font-style:italic;}
.src-tag{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); padding:1px 6px; margin-left:8px;}
.tl-item.encerramento .tl-dot{background:var(--st-concl); border-color:var(--st-concl); width:16px; height:16px; left:21px;}
.tl-date{font-family:var(--font-mono); font-size:10px; color:var(--ink-soft); margin-bottom:3px;}
.tl-label{font-family:var(--font-display); font-weight:600; font-size:14px;}
.tl-card{
  margin-top:8px; background:var(--paper); border:1px solid var(--line); padding:12px 14px; font-size:12.5px; cursor:pointer;
}
.tl-card .row{display:flex; justify-content:space-between; margin-bottom:6px;}
.tl-card .row:last-child{margin-bottom:0;}
.tl-card .tag{font-family:var(--font-mono); font-size:10px; padding:2px 6px; background:var(--st-paral-bg); color:var(--st-paral);}
.tl-card .tag.ok{background:var(--st-concl-bg); color:var(--st-concl);}
.tl-card.expand-hint{color:var(--accent); font-family:var(--font-mono); font-size:10.5px; margin-top:8px; padding:0; background:none; border:none;}
.tl-detail{display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12px; color:var(--ink-soft);}
.tl-detail.open{display:block;}
.tl-detail .d-row{display:flex; justify-content:space-between; padding:3px 0;}

.closure-summary{padding:16px 18px; font-size:13px; line-height:1.6; color:var(--ink);}
.closure-summary .lbl{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.06em; margin-bottom:5px;}

/* side panel */
.side-block{margin-bottom:2px;}
.progress-bar-wrap{padding:16px;}
.progress-track{height:8px; background:var(--line); position:relative; margin:10px 0 6px;}
.progress-fill{height:100%; background:var(--accent);}
.progress-nums{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);}

.photo-strip{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:12px;}
.photo-ph{aspect-ratio:4/3; background:linear-gradient(135deg,#dfe6e2,#cdd7d2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:9px; color:#8a9691; text-align:center; padding:6px;}

a.back-link, .link-btn{
  font-family:var(--font-mono); font-size:11px; color:var(--accent); cursor:pointer; background:none; border:none; padding:0;
  text-decoration:underline; text-underline-offset:3px;
}

.note{font-size:11px; color:var(--ink-soft); font-style:italic; padding:10px 16px 4px;}

@media(max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .overview-grid, .detail-grid, .muni-grid{grid-template-columns:1fr;}
  .obra-row{grid-template-columns:1fr; align-items:flex-start;}
}

/* ---- extras para versão com dataset completo ---- */
.monitor-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:10px;}
.monitor-cell{background:var(--card); padding:10px 12px;}
.monitor-cell .k{font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em; display:block; margin-bottom:3px;}
.monitor-cell .v{font-size:12.5px; font-weight:600;}
.data-note{font-size:11px; color:var(--ink-soft); padding:10px 16px; border-top:1px dashed var(--line); font-style:italic;}
.search-bar{padding:10px 16px; border-bottom:1px solid var(--line);}
.search-bar input{width:100%; padding:8px 10px; border:1px solid var(--line-strong); font-family:var(--font-mono); font-size:12.5px; background:var(--paper);}
.search-bar input:focus{outline:2px solid var(--accent); outline-offset:1px;}
.photo-ph.reallink{background:linear-gradient(135deg,#e3ecf7,#d3e0ef); color:var(--accent); font-family:var(--font-mono); cursor:default;}
.count-pill{font-family:var(--font-mono); font-size:11px; background:var(--accent-soft); color:var(--accent); padding:2px 8px;}


/* ---- cores reais por fase (dropdown oficial) ---- */
:root{
  --st-inicial:#C0672E; --st-inicial-bg:#F4E3D6;
  --st-projeto:#B8932A; --st-projeto-bg:#F3ECD4;
  --st-licitacao:#6F9A5C; --st-licitacao-bg:#E5EEE0;
}
.badge.inicial{background:var(--st-inicial-bg); color:var(--st-inicial);}
.badge.projeto{background:var(--st-projeto-bg); color:var(--st-projeto);}
.badge.licitacao{background:var(--st-licitacao-bg); color:var(--st-licitacao);}
.pin.inicial{color:var(--st-inicial);}
.pin.projeto{color:var(--st-projeto);}
.pin.licitacao{color:var(--st-licitacao);}

.prazos-table{width:100%; border-collapse:collapse; font-size:12px;}
.prazos-table th{text-align:left; font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:6px 10px; border-bottom:1px solid var(--line);}
.prazos-table td{padding:6px 10px; border-bottom:1px dashed var(--line);}
.prazos-table tr:last-child td{border-bottom:none;}
.prazos-table td.et{font-weight:500;}
.prazos-table td.dt{font-family:var(--font-mono); color:var(--ink-soft);}
.prazos-table td.dd{font-family:var(--font-mono); text-align:right; color:var(--accent); font-weight:600;}
.prazos-table td.pending{color:#B9C1BC; font-style:italic;}


/* ---- módulo: monitoramento de municípios (rios) ---- */
.nav-tabs{display:flex; gap:0; background:var(--navy-2); padding:0 24px;}
.nav-tab{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  color:#9FB4CC; background:none; border:none; padding:12px 18px; cursor:pointer;
  border-bottom:2px solid transparent;
}
.nav-tab.active{color:#fff; border-bottom-color:var(--accent);}
.nav-tab:hover{color:#fff;}

.rio-map-card{height:420px; border:none; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
.rio-map-card #rioMap{height:100%; width:100%; font-family:var(--font-body);}
.rio-toolbar{display:flex; gap:8px; flex-wrap:wrap; padding:16px 20px; align-items:center; background:var(--card); border-radius:var(--radius) var(--radius) 0 0; box-shadow:var(--shadow); margin-bottom:2px;}
.rio-search{flex:1; min-width:160px; padding:10px 14px; border:1px solid var(--line-strong); border-radius:22px; font-family:var(--font-body); font-size:13px; background:var(--paper);}
.rio-chip{
  font-family:var(--font-body); font-size:12px; letter-spacing:.02em;
  padding:7px 14px; border:1px solid var(--line-strong); border-radius:20px; background:var(--card); color:var(--ink-soft); cursor:pointer; font-weight:600;
}
.rio-chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}

.rio-row{
  display:grid; grid-template-columns:1fr auto auto auto; gap:16px; align-items:center;
  background:var(--card); border:none; border-radius:var(--radius-sm); padding:14px 18px; cursor:pointer; box-shadow:var(--shadow); margin-bottom:10px;
}
.rio-row:first-child{border-top:none;}
.rio-row:hover{background:var(--accent-soft); box-shadow:var(--shadow-hover);}
.rio-row .rname{font-family:var(--font-display); font-weight:700; font-size:14px;}
.rio-row .rsub{font-family:var(--font-body); font-size:12px; color:var(--ink-soft); margin-top:2px;}
.rio-obracount{font-family:var(--font-body); font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:4px 10px; border-radius:20px; white-space:nowrap;}
.rio-nivel{font-family:var(--font-body); font-size:14px; font-weight:700; text-align:right;}
.rio-var{font-family:var(--font-body); font-size:12px; text-align:right;}
.rio-var.up{color:var(--st-cancel);}
.rio-var.down{color:var(--accent);}

.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.status-dot.normal{background:var(--st-concl);}
.status-dot.atencao{background:var(--st-projeto);}
.status-dot.alerta{background:var(--st-inicial);}
.status-dot.inundacao{background:var(--st-cancel);}
.badge.rio-normal{background:var(--st-concl-bg); color:var(--st-concl);}
.badge.rio-atencao{background:var(--st-projeto-bg); color:var(--st-projeto);}
.badge.rio-alerta{background:var(--st-inicial-bg); color:var(--st-inicial);}
.badge.rio-inundacao{background:var(--st-cancel-bg); color:var(--st-cancel);}

.gauge-panel{padding:22px 18px 16px;}
.gauge-toprow{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
.gauge-track{position:relative; height:8px; background:var(--line); display:flex; border-radius:4px; overflow:visible;}
.gauge-seg{height:100%;}
.gauge-seg.normal{background:var(--st-concl);opacity:.4;}
.gauge-seg.atencao{background:var(--st-projeto);opacity:.4;}
.gauge-seg.alerta{background:var(--st-inicial);opacity:.4;}
.gauge-seg.inundacao{background:var(--st-cancel);opacity:.4;}
.gauge-seg:first-child{border-radius:4px 0 0 4px;}
.gauge-seg:last-child{border-radius:0 4px 4px 0;}
.gauge-marker{
  position:absolute; top:-30px; transform:translateX(-50%); white-space:nowrap;
  font-size:12px; font-weight:700; color:#fff;
  background:var(--marker-color, var(--navy)); padding:4px 10px; border-radius:3px;
}
.gauge-marker::after{
  content:''; position:absolute; left:50%; top:100%; width:2px; height:22px;
  background:var(--marker-color, var(--navy)); transform:translateX(-1px);
}
.gauge-marker::before{
  content:''; position:absolute; left:50%; top:100%; width:6px; height:6px; margin-top:16px;
  background:var(--marker-color, var(--navy)); border-radius:50%; transform:translate(-50%,0);
}
.gauge-scale-labels{display:flex; margin-top:8px;}
.gauge-scale-labels span{flex:1; font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);}
.rio-map-mini{height:200px; border:1px solid var(--line); margin-top:2px;}

/* ---- resumo ponto de controle ---- */
.resumo-section{margin-bottom:22px;}
.resumo-toprow{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.resumo-stat{background:var(--card); border:none; border-radius:var(--radius); padding:22px 18px; text-align:center; box-shadow:var(--shadow);}
.resumo-stat .n{font-family:var(--font-display); font-size:34px; font-weight:700; color:var(--navy); line-height:1;}
.resumo-stat .l{font-size:12px; color:var(--ink-soft); margin-top:8px; text-transform:uppercase; letter-spacing:.04em;}
.resumo-stat.accent .n{color:var(--accent);}

.resumo-two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
.chart-panel{background:var(--card); border:none; border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);}
.chart-panel-title{font-family:var(--font-body); font-size:13px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:18px; text-align:center; font-weight:700;}
.chart-flex{display:flex; flex-direction:column; align-items:center; gap:16px;}
.chart-legend{width:100%;}
.legend-row{justify-content:center; gap:10px;}
.chart-legend{flex:1; min-width:160px;}
.legend-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);}
.legend-row:last-child{border-bottom:none;}
.legend-name{display:flex; align-items:center; gap:8px; font-size:13px;}
.legend-dot{width:11px; height:11px; border-radius:50%; flex-shrink:0;}
.legend-val{font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--navy);}
.legend-pct{font-family:var(--font-body); font-size:11px; color:var(--ink-soft); margin-left:6px;}

.fin-panel{background:var(--card); border:none; border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); margin-top:16px;}
.fin-boxes{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:18px;}
.fin-box2{text-align:center; padding:20px 12px; background:var(--paper); border-radius:var(--radius-sm);}
.fin-box2 .n{font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--navy);}

.fin-box2 .p{font-family:var(--font-body); font-size:12px; font-weight:700; color:var(--accent); margin-top:3px;}
.fin-source{font-size:11px; color:var(--ink-soft); font-style:italic; padding-top:14px; border-top:1px solid var(--line);}

.bar-chart-wrap{overflow-x:auto;}

.bar-col{flex:1; display:flex; flex-direction:column-reverse; align-items:center; min-width:24px; position:relative;}
.bar-seg{width:100%;}
.bar-month-label{position:absolute; bottom:-20px; font-family:var(--font-body); font-size:9px; color:var(--ink-soft); white-space:nowrap; transform:rotate(-40deg); transform-origin:top left; left:2px;}
.bar-chart-legend{display:flex; gap:16px; margin-top:28px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft);}
.bar-chart-legend span{display:inline-flex; align-items:center; gap:5px;}
.bar-chart-legend i{width:10px; height:10px; display:inline-block;}

.line-chart-svg{width:100%; height:180px; display:block;}
.concluidas-table{width:100%; border-collapse:collapse; font-size:12px;}
.concluidas-table th{text-align:left; font-family:var(--font-body); font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; font-weight:700;}
.concluidas-table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top;}

/* ---- polish estético geral ---- */
.panel{ transition: box-shadow .15s ease; }
.panel:hover{ box-shadow: var(--shadow-hover); }
.stat::before{ background: linear-gradient(90deg, var(--accent), #6FA3DB); }

.resumo-stat{ position:relative; overflow:hidden; }
.resumo-stat .n{ letter-spacing:-.01em; }

.legend-row{ transition: background .1s ease; border-radius:6px; }
.legend-row:hover{ background: var(--paper); padding-left:6px; margin-left:-6px; }
.legend-dot{ box-shadow: 0 0 0 3px rgba(0,0,0,.03); }

.bar-col{ position:relative; }
.bar-seg:first-child{ border-radius:0 0 3px 3px; }
.bar-seg:last-child{ border-radius:4px 4px 0 0; }
.bar-chart-legend i{ border-radius:3px; }

.fin-box2{ transition: transform .12s ease; }
.fin-box2:hover{ transform: translateY(-2px); }

.rio-row, .muni-card, .obra-row, .concluidas-table tr{ transition: all .12s ease; }
.badge{ font-weight:700; }

.line-chart-svg text{ font-family: var(--font-body); }

.count-pill{ font-weight:700; letter-spacing:.02em; }

.breadcrumb button{ transition: color .1s ease; }

::-webkit-scrollbar{ height:8px; width:8px; }
::-webkit-scrollbar-thumb{ background: var(--line-strong); border-radius:4px; }
::-webkit-scrollbar-track{ background: transparent; }

.ds-embed-note{ font-size:11px; color:var(--ink-soft); padding:10px 20px; border-top:1px dashed var(--line); font-style:italic; }

// mapeamento oficial: FASE -> classe de cor
const FASE_STATUS = {
  "Inicial":"inicial", "Projeto":"projeto", "Licitação":"licitacao",
  "Execução":"exec",
  "Concluída":"concl", "Em funcionamento":"concl",
  "Em Cancelamento":"cancel"

function fmtMoney(v){
  if(v===null || v===undefined || v==="") return "—";
  return "R$ " + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function titleCase(s){
  return (s||'').toLowerCase().split(' ').map(w => w.length>2 || ['do','da','de','dos','das'].indexOf(w)===-1 ? (w.charAt(0).toUpperCase()+w.slice(1)) : w).join(' ');
}
function slugify(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function parseBR(d){
  if(!d) return null;
  const parts = d.split('/');
  if(parts.length!==3) return null;
  return new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
}
function daysBetween(d1, d2){
  if(!d1 || !d2) return null;
  return Math.round((d2-d1)/(1000*60*60*24));
}

/* ---- monta DATA.municipios a partir do dataset bruto ---- */
function buildData(){
  const byMuni = {};
  RAW.forEach(o => {
    const muniNome = titleCase(o.municipio);
    const muniId = slugify(muniNome);
    if(!byMuni[muniId]) byMuni[muniId] = { id:muniId, nome:muniNome, obras:[] };

    let coordsStr = "—", lat=null, lon=null;
    if(o.coords){
      const parts = o.coords.split(',').map(s=>parseFloat(s));
      if(parts.length===2 && !isNaN(parts[0]) && !isNaN(parts[1])){
        lat = parts[0]; lon = parts[1];
        coordsStr = lat.toFixed(4) + ", " + lon.toFixed(4);
      }
    }

    // "Obra paralisada" é uma DESCRIÇÃO dentro da fase Execução — tratamos
    // como status visual próprio (âmbar), mesmo a FASE principal sendo Execução.
    const isParalisada = (o.descricaoFase||'').toLowerCase().includes('paralisada');
    const status = isParalisada ? "paral" : (FASE_STATUS[o.faseAtual] || "inicial");
    const badgeLabel = o.descricaoFase || o.faseAtual || "—";

    byMuni[muniId].obras.push({
      id: slugify(o.estabelecimento) + "-" + o.proposta.slice(-4),
      nome: o.estabelecimento,
      tipo: o.tipo || "—",
      tipologia: o.tipologia,
      status: status,
      faseAtual: o.faseAtual,
      badgeLabel: badgeLabel,
      proposta: o.proposta,
      valor: o.valorProposta,
      valorLicitado: o.valorLicitado,
      saldoContratual: o.saldoContratual,
      percExec: o.percAtual,
      lat: lat, lon: lon,
      coords: coordsStr,
      marcos: o.marcos,
      servicosAndamento: o.servicosAndamento,
      comentarioAtual: o.comentarioAtual,
      monthly: o.timeline || []
    });
  });
  return Object.values(byMuni).sort((a,b)=>a.nome.localeCompare(b.nome));
}
const DATA = { municipios: buildData() };

function allObras(){
  return DATA.municipios.flatMap(m => m.obras.map(o => ({...o, municipio:m.nome, municipioId:m.id})));
}
function findObra(muniId, obraId){
  const m = DATA.municipios.find(x=>x.id===muniId);
  return {muni:m, obra:m.obras.find(o=>o.id===obraId)};
}

const STATUS_LABEL = {
  inicial:"Inicial", projeto:"Projeto", licitacao:"Licitação",
  exec:"Execução", concl:"Concluída / Em funcionamento",
  paral:"Paralisada", cancel:"Em cancelamento"
};

/* ---- projeção de coordenadas reais no painel esquemático ---- */
const allLat = RAW.map(o=>o.coords ? parseFloat(o.coords.split(',')[0]) : null).filter(v=>v!==null && !isNaN(v));
const allLon = RAW.map(o=>o.coords ? parseFloat(o.coords.split(',')[1]) : null).filter(v=>v!==null && !isNaN(v));
const LAT_MIN = Math.min(...allLat), LAT_MAX = Math.max(...allLat);
const LON_MIN = Math.min(...allLon), LON_MAX = Math.max(...allLon);
function project(lat, lon){
  const x = 6 + ((lon - LON_MIN)/(LON_MAX - LON_MIN)) * 88;
  const y = 6 + ((LAT_MAX - lat)/(LAT_MAX - LAT_MIN)) * 88;
  return {x,y};
}

  }
  if(state.view === "rio"){

}

/* ---------------- OVERVIEW ---------------- */
function renderOverview(){
  const obras = allObras();
  const counts = {};
  obras.forEach(o => counts[o.status] = (counts[o.status]||0) + 1);
  const total = obras.length;

  const pins = obras.filter(o=>o.lat && o.lon).map(o => {
    const p = project(o.lat, o.lon);
    return `<div class="pin ${o.status}" style="left:${p.x}%; top:${p.y}%;" title="${o.nome} — ${o.municipio} (${o.badgeLabel})" onclick="go('obra',{muniId:'${o.municipioId}', obraId:'${o.id}'})">
      <div class="dot"></div>
    </div>`;

function renderMuniGrid(list){
  const grid = document.getElementById('muniGrid');
  if(!grid) return;
  grid.innerHTML = list.map(m => `
    <div class="muni-card" onclick="go('municipio',{muniId:'${m.id}'})">
      <div class="muni-name">${m.nome}</div>
      <div class="muni-meta">${m.obras.length} estabelecimento${m.obras.length>1?'s':''}</div>

  `).join('');
}
function filterMunicipios(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  if(!q){ renderMuniGrid(DATA.municipios); return; }
  const filtered = DATA.municipios.filter(m =>
    m.nome.toLowerCase().includes(q) || m.obras.some(o=>o.nome.toLowerCase().includes(q))
  );
  renderMuniGrid(filtered);
}

/* ---------------- painel de prazos (aparece em TODAS as obras) ---------------- */
function renderPrazos(obra){
  const m = obra.marcos;
  const steps = [
    ['Habilitação da proposta', m.habilitacao],
    ['Conclusão do projeto', m.conclusaoProjeto],
    ['Homologação da licitação', m.homologacaoLicitacao],
    ['Superação da Ação Preparatória', m.superacaoAP],
    ['Transferência do recurso', m.transferenciaRecurso],
    ['Início efetivo da obra', m.inicioEfetivo],
    ['Superação do início de execução', m.superacaoInicioExec],
    ['Conclusão oficial (100%)', m.conclusaoOficial || null],
  ];
  let lastDate = null;
  const rows = steps.map(([label, dateStr]) => {
    const d = parseBR(dateStr);
    let ddCell = '<td class="pending">—</td>';
    if(d && lastDate){
      const dd = daysBetween(lastDate, d);
      ddCell = `<td class="dd">+${dd} dias</td>`;
    } else if(d && !lastDate){
      ddCell = `<td class="dd">—</td>`;
    }
    if(d) lastDate = d;
    return `<tr><td class="et">${label}</td><td class="${dateStr?'dt':'pending'}">${dateStr||'ainda não registrada'}</td>${ddCell}</tr>`;
  }).join('');

  const previstaConclusao = m.previsaoConclusao;
  return `
    <div class="panel" style="margin-bottom:2px;">
      <div class="panel-head">Prazos e marcos <span style="font-weight:400">previsão de conclusão: ${previstaConclusao||'—'}</span></div>
      <div class="panel-body" style="padding:6px 8px;">
        <table class="prazos-table">
          <tr><th>Etapa</th><th>Data</th><th>Tempo desde etapa anterior</th></tr>
          ${rows}
        </table>
      </div>
    </div>
  `;
}

/* ---------------- OBRA DETAIL ---------------- */
function renderObra(muni, obra){
  let tlItems = "";
  if(obra.marcos.habilitacao){
    tlItems += `<div class="tl-item milestone"><div class="tl-dot"></div><div class="tl-date">${obra.marcos.habilitacao}</div><div class="tl-label">Habilitação da proposta</div></div>`;
  }

    tlItems += `<div class="tl-item milestone"><div class="tl-dot"></div><div class="tl-date">${obra.marcos.inicioEfetivo}</div><div class="tl-label">Início efetivo da obra</div></div>`;
  }

  // snapshots mensais — só entram os meses com comentário escrito
  const comentados = obra.monthly.filter(t => t.comentario && t.comentario.trim());
  comentados.forEach(t => {
    tlItems += `<div class="tl-item snapshot">
      <div class="tl-dot"></div>
      <div class="tl-date">${t.mes}</div>
      <div class="tl-card">
        <span>${t.comentario}</span>

      </div>
    </div>`;
  });
  const ocultos = obra.monthly.length - comentados.length;

  const concluida = obra.status === 'concl';
  if(concluida){
    const real = ENCERRAMENTOS_REAIS[obra.proposta];

        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;"><span>Valor proposta</span><span style="font-family:var(--font-mono)">${fmtMoney(obra.valor)}</span></div>

      </div>

  return `

function obrasDoMunicipio(rioNome){
  const m = DATA.municipios.find(x => x.nome.trim().toLowerCase() === rioNome.trim().toLowerCase());
  return m ? m : null;

function rioBands(d){
  let normalMax, atencaoMax, alertaMax;
  switch(d.status){
    case 'normal': normalMax = d.nivel + 0.6; atencaoMax = normalMax + 0.6; alertaMax = atencaoMax + 0.7; break;
    case 'atencao': normalMax = d.nivel - 0.4; atencaoMax = d.nivel + 0.4; alertaMax = atencaoMax + 0.7; break;
    case 'alerta': normalMax = d.nivel - 1.2; atencaoMax = d.nivel - 0.5; alertaMax = d.nivel + 0.5; break;
    case 'inundacao': normalMax = d.nivel - 2.0; atencaoMax = d.nivel - 1.3; alertaMax = d.nivel - 0.6; break;
  }
  normalMax = Math.max(normalMax, 0.1);
  atencaoMax = Math.max(atencaoMax, normalMax+0.2);
  alertaMax = Math.max(alertaMax, atencaoMax+0.2);
  const scaleMax = alertaMax * 1.25;
  return {normalMax, atencaoMax, alertaMax, scaleMax};
}

function rioTrend(varh){
  if (varh === 0) return "Estável na última hora";
  return (varh>0 ? "Subiu " : "Desceu ") + Math.abs(varh).toFixed(1).replace(".",",") + " cm na última hora";
}
function rioVarLabel(varh){
  if (varh === 0) return `<span class="rio-var">→ estável</span>`;

const OBRA_STATUS_COLOR = {inicial:'#6E7A8A', projeto:'#B8932A', licitacao:'#6F9A5C', exec:'#3D7DCB', concl:'#3F8A63', paral:'#C98A3C', cancel:'#B5473F'};

/* localização real = endereço/coordenadas da OBRA (aba Dashboard da planilha).
   Não existe coordenada real de estação de rio nos dados — por isso o mapa
   mostra as obras (dado real), não um ponto genérico do município. */
function obrasComCoordenadas(){
  return DATA.municipios.flatMap(m => m.obras
    .filter(o => o.lat!==null && o.lon!==null)
    .map(o => ({...o, municipioNome:m.nome, municipioId:m.id}))
  );
}

function initObraMap(containerId, obras, centerLat, centerLng, zoom){
  if(rioLeafletMaps[containerId]){ rioLeafletMaps[containerId].remove(); }
  const map = L.map(containerId, {scrollWheelZoom:false}).setView([centerLat, centerLng], zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
  }).addTo(map);
  rioLeafletMaps[containerId] = map;
  if(!obras.length){
    setTimeout(()=>map.invalidateSize(), 80);
    return map;
  }
  obras.forEach(o => {
    const color = OBRA_STATUS_COLOR[o.status] || '#6E7A8A';
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);"></div>`,
      iconSize:[14,14], iconAnchor:[7,7]
    });
    L.marker([o.lat, o.lon], {icon})
      .addTo(map)
      .bindTooltip(`${o.nome} — ${o.municipioNome}`, {direction:'top'})
      .on('click', ()=>go('obra',{muniId:o.municipioId, obraId:o.id}));
  });
  setTimeout(()=>map.invalidateSize(), 80);
  return map;
}

function rioChart(serie){
  const w=460,h=90,pad=8;
  const min = Math.min(...serie), max = Math.max(...serie);
  const range = (max-min)||1;
  const step = (w-2*pad)/(serie.length-1);
  const pts = serie.map((v,i)=>{
    const x = pad + i*step;
    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return [x,y];
  });
  const linePath = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
    <path d="${areaPath}" fill="var(--accent-soft)"/>
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}
function rioSerie(d){
  const base = d.nivel - Math.abs(d.varh)/100*6;
  const pts = [];
  for(let i=0;i<24;i++){
    const t = i/23;
    const noise = Math.sin(i*1.7 + d.nivel)*0.01;
    pts.push(+(base + (d.nivel-base)*t + noise).toFixed(3));
  }
  return pts;
}

function buildPieSvg(data, size, opts){
  size = size || 140;
  opts = opts || {};
  const donut = opts.donut !== false; // true = rosca; false = pizza cheia
  const showValues = opts.showValues !== false; // mostra número na fatia
  const total = data.reduce((s,d)=>s+d.v,0) || 1;
  const cx=size/2, cy=size/2, r=size/2 - 4;
  let angle = -90;
  let paths = '';
  let labels = '';
  data.forEach(d=>{
    const slice = (d.v/total)*360;
    if(d.v<=0) return;
    const a1 = angle;
    const x1 = cx + r*Math.cos(a1*Math.PI/180);
    const y1 = cy + r*Math.sin(a1*Math.PI/180);
    angle += slice;
    const a2 = angle;
    const x2 = cx + r*Math.cos(a2*Math.PI/180);
    const y2 = cy + r*Math.sin(a2*Math.PI/180);
    const large = slice > 180 ? 1 : 0;
    if(slice >= 359.99){
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${d.color}"/>`;
    } else {
      paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${d.color}"/>`;
    }
    if(showValues && slice > 14){
      const mid = (a1 + a2) / 2;
      const lr = donut ? r*0.72 : r*0.62;
      const lx = cx + lr*Math.cos(mid*Math.PI/180);
      const ly = cy + lr*Math.sin(mid*Math.PI/180);
      labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="${size*0.11}" font-weight="700" fill="#fff">${d.v}</text>`;
    }
  });
  const hole = donut ? size*0.30 : 0;
  const holeCircle = donut ? `<circle cx="${cx}" cy="${cy}" r="${hole}" fill="var(--card)"/>` : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;">${paths}${holeCircle}${labels}</svg>`;
}

const MES_ORDER = ["Ago/2025","Set/2025","Out/2025","Nov/2025","Dez/2025","Jan/2026","Fev/2026","Mar/2026","Abr/2026","Mai/2026","Jun/2026","Jul/2026"];
const MES_STATUS_COLOR = {prep:'#8FB8DE', exec:'#4A90D9', concl:'#E8A838', cancel:'#C0504D'};

function bucketFase(fase){
  if(!fase) return 'prep';
  if(fase.includes('Execução')) return 'exec';
  if(fase.includes('Concluída') || fase.includes('funcionamento')) return 'concl';
  if(fase.includes('Cancelamento')) return 'cancel';
  return 'prep';
}

function renderStatusPorMes(){
  const obras = allObras();
  const perMonth = MES_ORDER.map(mes => {
    const counts = {prep:0, exec:0, concl:0, cancel:0};
    obras.forEach(o => {
      const snap = (o.monthly||[]).find(t => t.mes === mes);
      const fase = snap ? (snap.fase||'') : o.faseAtual;
      counts[bucketFase(fase)]++;
    });
    return {mes, counts};
  });
  const maxTotal = Math.max(...perMonth.map(m => m.counts.prep+m.counts.exec+m.counts.concl+m.counts.cancel));

  const cols = perMonth.map(m => {
    const total = m.counts.prep+m.counts.exec+m.counts.concl+m.counts.cancel;
    const segs = ['prep','exec','concl','cancel'].map(k => {
      const h = (m.counts[k]/maxTotal)*130;
      return h>0 ? `<div class="bar-seg" style="height:${h}px;background:${MES_STATUS_COLOR[k]}" title="${k}: ${m.counts[k]}"></div>` : '';
    }).join('');
    return `<div class="bar-col">${segs}<span class="bar-month-label">${m.mes}</span></div>`;
  }).join('');

  return `
    <div class="chart-panel-full">
      <div class="chart-panel-title">Status das obras por mês</div>
      <div class="bar-chart-wrap"><div class="bar-chart">${cols}</div></div>
      <div class="bar-chart-legend">
        <span><i style="background:${MES_STATUS_COLOR.prep}"></i>Ação Preparatória</span>
        <span><i style="background:${MES_STATUS_COLOR.exec}"></i>Execução</span>
        <span><i style="background:${MES_STATUS_COLOR.concl}"></i>Concluídas</span>
        <span><i style="background:${MES_STATUS_COLOR.cancel}"></i>Cancelamento</span>
      </div>
    </div>
  `;
}

/* ---------------- VALOR TOTAL REPASSADO (linha, dado real mensal) ---------------- */
function renderRepasseChart(){
  const w=700,h=180,pad=30;
  const vals = MONTHLY_REPASSE.map(m=>m[1]);
  const max = Math.max(...vals);
  const step = (w-2*pad)/(vals.length-1);
  const pts = vals.map((v,i)=>{
    const x = pad + i*step;
    const y = h-24 - (v/max)*(h-50);
    return [x,y];
  });
  const linePath = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h-24} L${pts[0][0].toFixed(1)},${h-24} Z`;
  const lastVal = fmtMoney(vals[vals.length-1]);
  return `
    <div class="chart-panel-full">
      <div class="chart-panel-title">Valor total repassado aos municípios <span style="font-family:var(--font-mono);color:var(--accent);font-weight:700;">${lastVal}</span></div>
      <svg class="line-chart-svg" viewBox="0 0 ${w} ${h}">
        <defs><linearGradient id="repasseGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3D7DCB" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#3D7DCB" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${areaPath}" fill="url(#repasseGrad)"/>
        <path d="${linePath}" fill="none" stroke="#3D7DCB" stroke-width="2"/>
        ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="#3D7DCB"/>`).join('')}
        ${MONTHLY_REPASSE.map((m,i)=>`<text x="${pts[i][0]}" y="${h-8}" font-size="8" fill="#5B6B63" text-anchor="middle">${m[0].split('/')[0]}</text>`).join('')}
      </svg>
      <div class="fin-source">Somado a partir da coluna REPASSADO da aba Dashboard, por Mês/Ano — dado real, não estimado.</div>
    </div>
  `;
}

function renderObrasConcluidasTable(){
  const concluidas = allObras().filter(o=>o.status==='concl');
  const rows = concluidas.map(o => {
    const info = REPASSE_LOOKUP[o.proposta] || {};
    return {...o, endereco: info.endereco || '—', repassado: info.repassado || 0};
  }).sort((a,b)=>a.municipio.localeCompare(b.municipio));

  const trs = rows.map(o => `
    <tr onclick="go('obra',{muniId:'${o.municipioId}', obraId:'${o.id}'})">
      <td>${o.municipio}</td>
      <td>${o.nome}</td>
      <td>${o.tipo}</td>
      <td>${o.endereco}</td>
      <td class="money">${fmtMoney(o.repassado)}</td>
      <td class="money">${fmtMoney(o.valorLicitado)}</td>
    </tr>`).join('');

  return `
    <div class="panel" style="margin-top:2px;">
      <div class="panel-head">Obras concluídas <span class="count-pill">${rows.length}</span></div>
      <div class="panel-body" style="padding:0; overflow-x:auto;">
        <table class="concluidas-table">
          <tr><th>Município</th><th>Estabelecimento</th><th>Tipo de Obra</th><th>Endereço</th><th>Valor Repassado</th><th>Valor Licitado</th></tr>
          ${trs}
        </table>
      </div>
    </div>
  `;
}

function parseCoordsCsv(s){
  if(!s) return {lat:null, lon:null};
  const parts = String(s).split(/[,;]/).map(x=>parseFloat(x.trim()));
  if(parts.length===2 && !isNaN(parts[0]) && !isNaN(parts[1])) return {lat:parts[0], lon:parts[1]};
  return {lat:null, lon:null};
}

    const limpar = function(){
      try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
      if(tag && tag.parentNode) tag.parentNode.removeChild(tag);
      clearTimeout(timeoutId);
    };

    window[cbName] = function(json){
      concluido = true;
      try {
        if(json.erro) throw new Error(json.erro);
        const novoRaw = transformJson(json.obras);
        if(!novoRaw.length) throw new Error("planilha retornou 0 obras");
        RAW.length = 0;
        novoRaw.forEach(o => RAW.push(o));
        DATA.municipios = buildData();
        const agora = new Date();
        banner.textContent = `Dados sincronizados com a planilha às ${agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
        setTimeout(()=>{ banner.style.display='none'; }, 4000);
        limpar();
        resolve(true);
      } catch(err){
        banner.textContent = 'Não foi possível sincronizar — mostrando snapshot salvo. (' + err.message + ')';
        banner.style.background = 'var(--st-cancel)';
        setTimeout(()=>{ banner.style.display='none'; }, 7000);
        limpar();
        resolve(false);
      }
    };

    const sep = APPS_SCRIPT_URL.indexOf('?') === -1 ? '?' : '&';
    const tag = document.createElement('script');
    tag.src = APPS_SCRIPT_URL + sep + 'callback=' + cbName + '&t=' + Date.now();
    tag.onerror = function(){
      if(concluido) return;
      banner.textContent = 'Não foi possível sincronizar — mostrando snapshot salvo. (erro de conexão)';
      banner.style.background = 'var(--st-cancel)';
      setTimeout(()=>{ banner.style.display='none'; }, 7000);
      limpar();
      resolve(false);
    };
    const timeoutId = setTimeout(function(){
      if(concluido) return;
      banner.textContent = 'Não foi possível sincronizar — mostrando snapshot salvo. (tempo esgotado)';
      banner.style.background = 'var(--st-cancel)';
      setTimeout(()=>{ banner.style.display='none'; }, 7000);
      limpar();
      resolve(false);
    }, 15000);

    document.body.appendChild(tag);
  });
}


function atualizarTimestamp(){
  const el = document.getElementById('tbTimestamp');
  if(!el) return;
  const agora = new Date();
  const hora = agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  el.textContent = 'Sincronizado às ' + hora;
}

(async function boot(){
  atualizarTimestamp();
  setInterval(atualizarTimestamp, 60000);
  await carregarDadosAoVivo();
  render();
})();
</script>
